---
# Source: web/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  labels:
    helm.sh/chart: web-0.3.1
spec:
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Source: web/templates/metrics-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: demo-web-metrics
spec:
  selector:
    app.kubernetes.io/name: web-metrics
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
# Source: web/charts/redis/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: demo-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Source: web/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  labels:
    helm.sh/chart: web-0.3.1
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: demo
    spec:
      serviceAccountName: demo-web
      initContainers:
        - name: migrate
          image: "nexus.tpb.vn:5000/web:1.4.0"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: web
          image: "nexus.tpb.vn:5000/web:1.4.0"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: demo-web-env
            - secretRef:
                name: web-db-credentials
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: metrics
          image: "nexus.tpb.vn:5000/exporter:0.9"
          ports:
            - name: metrics
              containerPort: 9100
---
# Source: web/templates/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-web-cleanup
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: "nexus.tpb.vn:5000/web:1.4.0"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
---
# Source: web/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-web
  minReplicas: 2
  maxReplicas: 5
---
# Source: web/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-web
spec:
  ingressClassName: nginx
  tls:
    - secretName: wildcard-tpb-vn
      hosts:
        - web.tpb.vn
  rules:
    - host: web.tpb.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: demo-web
                port:
                  name: http
---
# Source: web/templates/route.yaml
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: demo-web-admin
spec:
  host: admin.web.tpb.vn
  to:
    kind: Service
    name: demo-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Source: web/charts/redis/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-redis
spec:
  replicas: 3
  serviceName: demo-redis
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: "nexus.tpb.vn:5000/redis:7.2.4"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        resources:
          requests:
            storage: 8Gi
