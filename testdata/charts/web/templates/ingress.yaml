{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "web.fullname" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: wildcard-tpb-vn
      hosts:
        - {{ .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "web.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "web.fullname" . }}
                port:
                  name: http
{{- end }}
