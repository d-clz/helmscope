{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "web.fullname" . }}-admin
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: {{ include "web.fullname" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
