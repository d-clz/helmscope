# Builds helmscope inside the air gap and publishes binaries to the Nexus raw
# repository on tags. No Go modules are downloaded (GOPROXY=off).
#
# Variables (Settings > CI/CD > Variables):
#   NEXUS_USER, NEXUS_PASSWORD   masked
#   NEXUS_RAW_URL                e.g. https://nexus.tpb.vn/repository/idp-raw
#   INTERNAL_CA_FILE             file variable, optional: CA for Nexus TLS
#   GO_IMAGE                     optional override of the build image
#   NODE_IMAGE                   optional override of the UI test image

variables:
  GO_IMAGE: nexus.tpb.vn:5000/library/golang:1.24
  NODE_IMAGE: nexus.tpb.vn:5000/library/node:22-alpine
  GOPROXY: "off"
  CGO_ENABLED: "0"

stages: [test, build, publish]

test:go:
  stage: test
  image: $GO_IMAGE
  script:
    - go vet ./...
    - go test ./...

test:ui:
  stage: test
  image: $NODE_IMAGE
  script:
    - node web/core.test.js

build:
  stage: build
  image: $GO_IMAGE
  script:
    - export VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - make dist VERSION="$VERSION"
  artifacts:
    paths: [dist/]
    expire_in: 2 weeks

publish:nexus:
  stage: publish
  image: $GO_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      CA=""
      if [ -n "${INTERNAL_CA_FILE:-}" ]; then CA="--cacert $INTERNAL_CA_FILE"; fi
      for f in dist/*; do
        echo "uploading $f"
        curl -fsS $CA -u "$NEXUS_USER:$NEXUS_PASSWORD" --upload-file "$f" \
          "$NEXUS_RAW_URL/helmscope/$CI_COMMIT_TAG/$(basename "$f")"
      done
      echo "published to $NEXUS_RAW_URL/helmscope/$CI_COMMIT_TAG/"
